name: Source watch

on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "41 8 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sources to check"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - algorithm

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select monitoring mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$REQUESTED_MODE"
          elif [ "$SCHEDULE" = "41 8 * * 1" ]; then
            mode="full"
          else
            mode="algorithm"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Check sources
        run: node scripts/check-source-updates.mjs --mode "${{ steps.mode.outputs.mode }}" --json source-watch.json --markdown source-watch.md

      - name: Add report to workflow summary
        if: always()
        run: cat source-watch.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-watch-${{ steps.mode.outputs.mode }}
          path: |
            source-watch.json
            source-watch.md
          retention-days: 30

      - name: Open deduplicated review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('source-watch.json', 'utf8'));
            if (report.status !== 'attention') return;

            const marker = `<!-- source-watch:${report.fingerprint} -->`;
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'source-update',
              per_page: 100,
            });
            if (existing.some((issue) => issue.body && issue.body.includes(marker))) return;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'source-update' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'source-update',
                color: '1d76db',
                description: 'Official X source change requiring editorial review',
              });
            }

            const body = fs.readFileSync('source-watch.md', 'utf8');
            await github.rest.issues.create({
              owner,
              repo,
              title: `Review X source changes (${report.mode}, ${report.fingerprint})`,
              body,
              labels: ['source-update'],
            });
